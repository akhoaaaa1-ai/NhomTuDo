<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Our Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      bottom: -150px;
      width: 15px;
      height: 15px;
      background: rgba(0, 255, 200, 0.4);
      border-radius: 50%;
      animation: float 10s infinite ease-in;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-120vh) scale(0.5); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.1);
      padding: 50px 60px;
      border-radius: 30px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.4);
      width: 380px;
      transition: transform 0.4s ease;
    }

    .container:hover { transform: scale(1.02); }

    h1 {
      font-size: 2.5rem;
      color: #00ffe1;
      text-shadow: 0 0 15px #00ffe1;
      margin-bottom: 25px;
    }

    .member {
      display: none;
      animation: fadeIn 0.8s ease-in-out;
    }

    .member.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .member img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #00ffe1;
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.6);
      margin-bottom: 20px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .member img:hover { transform: scale(1.1) rotate(3deg); }

    .member h2 {
      font-weight: 600;
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #fff;
    }

    .btn-about {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      padding: 10px 25px;
      color: white;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(255, 75, 43, 0.5);
    }

    .btn-about:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 75, 43, 0.8);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    .arrow-btn {
      background: #00ffe1;
      border: none;
      color: #000;
      font-weight: 600;
      padding: 10px 25px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px #00ffe1;
    }

    .arrow-btn:hover {
      transform: scale(1.1);
      background: #00ffbf;
      box-shadow: 0 0 25px #00ffe1;
    }

    @media (max-width: 500px) {
      .container { width: 85%; padding: 40px 30px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>

<body>
  <div class="particles"></div>

  <div class="container">
    <h1>Meet Our Team</h1>

    <div id="members">
      <div class="member active"
      <div class="member" data-link="https://berei06.github.io/Portfolio_NguyenHoangPhuc_24050019/">
        <img src="images/phuc.jpg" alt="Phúc">
        <h2>Nguyễn Hoàng Phúc</h2>
        <button class="btn-about">About Me</button>
      </div>

      <div class="member" data-link="https://24050036-svg.github.io/NguyenTruongAnhKhoa-24050036/">
        <img src="images/khoa.jpg" alt="Khoa">
        <h2>Nguyễn Trương Anh Khoa</h2>
        <button class="btn-about">About Me</button>
      </div>

      <div class="member" data-link="https://japannguyen.github.io/NguyenQuangNhat-24050025/">
        <img src="images/nhat.jpg" alt="Nhật">
        <h2>Nguyễn Quang Nhật</h2>
        <button class="btn-about">About Me</button>
      </div>

      <div class="member" data-link="https://enna2006.github.io/phat/">
        <img src="images/phat.jpg" alt="Phát">
        <h2>Voong Sìn Phát</h2>
        <button class="btn-about">About Me</button>
      </div>

      <div class="member" data-link="https://minhthang5956535-wq.github.io/Portfolo/">
        <img src="images/thang.jpg" alt="Thắng">
        <h2>Huỳnh Minh Thắng</h2>
        <button class="btn-about">About Me</button>
      </div>
    </div>

    <div class="controls">
      <button class="arrow-btn" id="prev">← Back</button>
      <button class="arrow-btn" id="next">Next →</button>
    </div>
  </div>

  <script>
    const members = document.querySelectorAll('.member');
    const nextBtn = document.getElementById('next');
    const prevBtn = document.getElementById('prev');
    const aboutBtns = document.querySelectorAll('.btn-about');
    const particles = document.querySelector('.particles');
    let index = 0;

    function showMember(i) {
      members.forEach(m => m.classList.remove('active'));
      members[i].classList.add('active');
    }

    nextBtn.addEventListener('click', () => {
      index = (index + 1) % members.length;
      showMember(index);
    });

    prevBtn.addEventListener('click', () => {
      index = (index - 1 + members.length) % members.length;
      showMember(index);
    });

    // Auto slide
    setInterval(() => {
      index = (index + 1) % members.length;
      showMember(index);
    }, 5000);

    // Khi nhấn "About Me" mở link
    aboutBtns.forEach((btn, i) => {
      btn.addEventListener('click', () => {
        const member = members[i];
        const link = member.dataset.link;
        if (link && link.startsWith("http")) {
          window.open(link, "_blank");
        } else {
          alert("Link chưa được gắn cho thành viên này!");
        }
      });
    });

    // Hạt bay
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.animationDuration = `${5 + Math.random() * 5}s`;
      particle.style.width = particle.style.height = `${5 + Math.random() * 15}px`;
      particles.appendChild(particle);
    }
  </script>
</body>
</html>
